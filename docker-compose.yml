version: "3.9"

services:
  # ─── Base de données PostgreSQL ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: imaz_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-imaz_db}
      POSTGRES_USER:     ${POSTGRES_USER:-imaz_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-imaz_user} -d ${POSTGRES_DB:-imaz_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - imaz_net

  # ─── Redis (sessions / cache) ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: imaz_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    networks:
      - imaz_net

  # ─── Application Next.js ─────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: imaz-platform:latest
    container_name: imaz_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL:      postgresql://${POSTGRES_USER:-imaz_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-imaz_db}
      REDIS_URL:         redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      JWT_SECRET:        ${JWT_SECRET}
      NEXTAUTH_SECRET:   ${NEXTAUTH_SECRET}
      NEXTAUTH_URL:      ${NEXTAUTH_URL:-http://localhost}
      SMTP_HOST:         ${SMTP_HOST:-}
      SMTP_PORT:         ${SMTP_PORT:-587}
      SMTP_USER:         ${SMTP_USER:-}
      SMTP_PASS:         ${SMTP_PASS:-}
      SMTP_FROM:         ${SMTP_FROM:-noreply@imaz.bf}
      FASO_SMS_API_KEY:  ${FASO_SMS_API_KEY:-}
      FASO_SMS_SENDER:   ${FASO_SMS_SENDER:-IMAZ}
      NEXT_PUBLIC_APP_URL: ${NEXTAUTH_URL:-http://localhost}
    volumes:
      - uploads:/app/public/uploads
    networks:
      - imaz_net
    ports:
      - "3000:3000"

  # ─── Nginx reverse proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: imaz_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    networks:
      - imaz_net

  # ─── Certbot (Let's Encrypt) ─────────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: imaz_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

volumes:
  postgres_data:
  redis_data:
  uploads:
  certbot_www:
  certbot_certs:

networks:
  imaz_net:
    driver: bridge
