# ── Redirection HTTP → HTTPS ───────────────────────────────────────────────────
server {
    listen 80;
    server_name imaz.bf www.imaz.bf;

    # Validation Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS (production) ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name imaz.bf www.imaz.bf;

    ssl_certificate     /etc/letsencrypt/live/imaz.bf/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imaz.bf/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy
      "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self';"
      always;

    # Fichiers statiques Next.js (cache long)
    location /_next/static/ {
        proxy_pass         http://app:3000;
        proxy_cache_valid  200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Uploads (images produits)
    location /uploads/ {
        alias /app/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Application principale
    location / {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# ── HTTP local / développement (sans SSL) ─────────────────────────────────────
server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
