name: CI — Tests & Lint

on:
  push:
    branches: [main, "claude/**", develop]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint & TypeScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: TypeScript — vérification des types
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

  build:
    name: Build Next.js
    runs-on: ubuntu-latest
    needs: lint-typecheck

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Build production
        run: npm run build
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          JWT_SECRET: ci-test-secret-key-for-build-only
          NEXTAUTH_SECRET: ci-nextauth-secret
          NEXTAUTH_URL: http://localhost:3000

      - name: Archiver le build
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build-${{ github.sha }}
          path: |
            .next/standalone
            .next/static
          retention-days: 7

  integration-test:
    name: Tests d'intégration
    runs-on: ubuntu-latest
    needs: lint-typecheck

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: imaz_test
          POSTGRES_USER: imaz_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Appliquer le schéma Prisma
        run: npx prisma db push
        env:
          DATABASE_URL: postgresql://imaz_user:test_password@localhost:5432/imaz_test

      - name: Charger les données de test (seed)
        run: npm run db:seed
        env:
          DATABASE_URL: postgresql://imaz_user:test_password@localhost:5432/imaz_test
